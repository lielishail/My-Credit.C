<body><div class="app"><div id="homePage" class="page active">
<header><div class="headrow"><div><h1>信用卡還款提醒</h1><div class="sub">清楚掌握每張卡的到期日</div></div>
<div style="display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end">
  <button class="themeBtn" id="settingsBtn">設置</button>
  <button id="notifyBtn" style="border:1px solid #ffffff55;background:#ffffff18;color:#fff;border-radius:12px;padding:9px 10px;font-weight:750">開啟通知</button>
  <button id="testNotifyBtn" style="border:1px solid #ffffff55;background:#ffffff18;color:#fff;border-radius:12px;padding:9px 10px;font-weight:750">測試通知</button>
</div>
</div><div class="stats"><div class="stat"><small>待處理</small><strong id="count">0 筆</strong></div><div class="stat"><small>尚未還款</small><strong id="total">0.00</strong></div></div><div class="periodBar"><button class="periodBtn" id="lastPeriodBtn"><span>上期及過往記錄</span><small id="lastPeriodQuick">未有記錄</small></button><button class="limitNav" id="limitPageBtn"><span>信用額及使用率</span><small>查看各卡額度 ›</small></button></div></header>
<main><div class="section"><h2>還款清單</h2><span>依分類及到期日排列</span></div><div id="list"></div></main>
<button class="add" id="addBtn">＋ 新增還款</button></div>
<div id="recordsPage" class="page recordsPage">
  <div class="recordsHeader"><div class="recordsHeadRow"><button class="backBtn" id="recordsBack" aria-label="返回">‹</button><div><div class="recordsTitle">還款記錄</div><div class="recordsSub">上期狀態及所有過往結單</div></div></div></div>
  <div class="recordControls"><label for="periodSelect">查詢結單月份</label><select id="periodSelect"></select></div>
  <div class="recordsContent" id="recordsContent"></div>
  <button class="recordsBottom" id="recordsHome">返回信用卡清單</button>
</div>
<div id="limitsPage" class="page limitPage">
  <div class="recordsHeader"><div class="recordsHeadRow"><button class="backBtn" id="limitsBack" aria-label="返回">‹</button><div><div class="recordsTitle">信用額及使用率</div></div></div><div id="portfolioSummary"></div></div>
  <div class="limitContent"><div id="scorePrediction"></div><div id="limitContent"></div></div>
  <button class="recordsBottom" id="limitsHome">返回信用卡清單</button>
</div>
<div id="settingsPage" class="page limitPage">
 <div class="recordsHeader"><div class="recordsHeadRow"><button class="backBtn" id="settingsBack">‹</button><div><div class="recordsTitle">外觀設置</div></div></div></div>
 <div class="limitContent"><section class="limitCard"><div class="themePreview" id="themePreview"><div class="themePreviewOverlay" id="themePreviewOverlay"></div></div><div class="themeChoices" id="themeChoices"><button class="themeChoice themeLight" data-theme="light"><span>淺白</span></button><button class="themeChoice themeGray" data-theme="gray"><span>淺灰</span></button><button class="themeChoice themeBlue" data-theme="blue"><span>淺藍</span></button><button class="themeChoice themeWarm" data-theme="warm"><span>暖白</span></button><button class="themeChoice themeGreen" data-theme="green"><span>淺綠</span></button><button class="themeChoice themeImage" data-theme="image"><span>自選圖片</span></button></div><label class="imageLabel" for="backgroundImage">選擇手機圖片</label><input class="imageInput" id="backgroundImage" type="file" accept="image/*"><div class="rangeRow"><div class="rangeHead"><span>淺白／灰遮罩透明度</span><span id="opacityValue">82%</span></div><input id="overlayOpacity" type="range" min="0" max="95" value="82"></div><div class="positionGrid"><div class="rangeRow"><div class="rangeHead"><span>左右位置</span><span id="positionXValue">50%</span></div><input id="positionX" type="range" min="0" max="100" value="50"></div><div class="rangeRow"><div class="rangeHead"><span>上下位置</span><span id="positionYValue">50%</span></div><input id="positionY" type="range" min="0" max="100" value="50"></div></div><div class="fitOptions"><button type="button" id="fitCover">填滿畫面</button><button type="button" id="fitContain">完整顯示</button></div><div class="moduleColorBox"><label><span>模組顏色</span><input id="moduleColor" type="color" value="#edf3f7"></label><div class="rangeRow"><div class="rangeHead"><span>清單淺灰透明度</span><span id="listGreyValue">72%</span></div><input id="listGreyOpacity" type="range" min="0" max="100" value="72"></div></div><div class="dataBox"><div class="dataTitle">資料備份 / DATA BACKUP</div><div class="dataActions"><button type="button" id="exportData">備份 JSON</button><label class="dataImportLabel" for="importData">載入 JSON</label></div><input class="dataFile" id="importData" type="file" accept="application/json,.json"><div class="dataNote" id="dataStatus"></div></div><div class="languageBox"><label for="languageSelect">語言 / Language</label><select id="languageSelect"><option value="zh-Hant">中文（繁體）</option><option value="zh-Hans">简体中文</option><option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option></select></div><div class="settingsActions"><button id="resetTheme">恢復預設</button><button class="primary" id="saveTheme">儲存</button></div></section></div>
 <button class="recordsBottom" id="settingsHome">返回信用卡清單</button>
</div></div>
<dialog id="editor"><div class="modalHead" id="modalTitle">新增還款</div><form class="form" id="form"><input type="hidden" id="id"><div class="field"><label>分類</label><input id="category" placeholder="例如 HSBC" required></div><div class="field"><label>信用卡名稱</label><input id="cardName" placeholder="例如 RED" required></div><div class="grid"><div class="field"><label>信用卡尾4碼</label><input id="last4" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="9999" required></div><div class="field"><label>幣別</label><select id="currency"><option>HKD</option><option>USD</option><option>CNY</option><option>JPY</option><option>EUR</option><option>GBP</option></select></div></div><div class="field"><label>應還金額</label><input id="amount" type="number" min="0" step="0.01" placeholder="9999.00" required></div><div class="grid"><div class="field"><label>今期結單</label><input id="statementDate" type="date" required></div><div class="field"><label>還款到期</label><input id="dueDate" type="date" required><div id="predictionHint" style="font-size:11px;color:#688096;margin:5px 2px 0"></div></div></div><div class="modalActions"><button type="button" id="cancel">取消</button><button class="save" type="submit">儲存</button></div></form></dialog><dialog id="limitDialog"><div class="modalHead" id="limitDialogTitle">設定信用額</div><form class="form" id="limitForm"><input type="hidden" id="limitCardId"><div class="field"><label>信用卡總額</label><input id="creditLimit" type="number" min="0" step="0.01" placeholder="50000" required></div><div class="field"><label>目前已使用額</label><input id="currentUsed" type="number" min="0" step="0.01" placeholder="例如 18000" required></div><div class="notice">上期未還會自動採用首頁該卡尚未還款金額；今期消費＝目前已使用額－上期未還。</div><div class="modalActions"><button type="button" id="cancelLimit">取消</button><button class="save" type="submit">儲存</button></div></form></dialog><dialog id="periodDialog"><div class="modalHead" id="periodTitle">上期總覽</div><div class="form"><div class="periodSummary"><div class="periodBox"><small>上期尚未還款</small><strong id="periodUnpaid">0.00</strong></div><div class="periodBox"><small>上期已還清</small><strong id="periodPaid">0.00</strong></div></div><div class="periodList" id="periodList"></div><div class="modalActions"><button type="button" id="closePeriod">關閉</button></div></div></dialog><div class="toast" id="toast"></div>
<script>
const KEY='card-reminder-v1',HISTORY_KEY='card-reminder-history-v1',LIMIT_KEY='card-reminder-limits-v1',THEME_KEY='card-reminder-theme-v1',LANG_KEY='card-reminder-language-v1';let cards=JSON.parse(localStorage.getItem(KEY)||'[]');let history=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');let limits=JSON.parse(localStorage.getItem(LIMIT_KEY)||'{}');cards=cards.map(c=>({...c,statementDate:c.statementDate||c.nextStatementDate||''}));const $=id=>document.getElementById(id);const list=$('list'),dlg=$('editor');
const money=(n,c)=>`${c} ${Number(n).toLocaleString('en-HK',{minimumFractionDigits:2,maximumFractionDigits:2})}`;
function daysLeft(d){const a=new Date();a.setHours(0,0,0,0);const b=new Date(d+'T00:00:00');return Math.round((b-a)/86400000)}
function status(c){if(c.paid)return['已完成','done'];let d=daysLeft(c.dueDate);if(d<0)return[`逾期 ${-d} 天`,'urgent'];if(d===0)return['今日到期','urgent'];if(d===1)return['明日到期','soon'];if(d<=3)return[`還有 ${d} 天`,'soon'];return[`還有 ${d} 天`,'']}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function periodKey(date){return date&&/^\d{4}-\d{2}/.test(date)?date.slice(0,7):''}
function periodLabel(key){if(!key)return'未設定期別';let [y,m]=key.split('-');return`${y}年${Number(m)}月結單`}
function allPeriodRecords(){
 const active=cards.map(c=>({...c,recordState:c.paid?'paid':'unpaid'}));
 const archived=history.map(h=>({...h,recordState:'paid'}));
 const seen=new Set(),result=[];
 [...active,...archived].forEach(r=>{let k=r.archiveKey||`${r.id}|${r.statementDate}|${r.dueDate}`;if(!seen.has(k)){seen.add(k);result.push(r)}});return result
}
function latestPeriodBeforeCurrent(){
 const keys=[...new Set(allPeriodRecords().map(r=>periodKey(r.statementDate)).filter(Boolean))].sort();
 if(!keys.length)return'';const current=new Date().toISOString().slice(0,7),older=keys.filter(k=>k<current);return older.length?older[older.length-1]:keys[keys.length-1]
}
function summarizePeriod(key){
 const rows=allPeriodRecords().filter(r=>periodKey(r.statementDate)===key),unpaid=rows.filter(r=>r.recordState==='unpaid'),paid=rows.filter(r=>r.recordState==='paid');
 const fmtSummary=arr=>{let sums={};arr.forEach(r=>sums[r.currency]=(sums[r.currency]||0)+Number(r.amount));let ks=Object.keys(sums);return!ks.length?'0.00':ks.length===1?money(sums[ks[0]],ks[0]):ks.map(k=>money(sums[k],k)).join(' + ')};
 return{rows,unpaid,paid,unpaidText:fmtSummary(unpaid),paidText:fmtSummary(paid)}
}
function updateLastPeriod(){let key=latestPeriodBeforeCurrent();if(!key){$('lastPeriodQuick').textContent='未有記錄';return}$('lastPeriodQuick').textContent=periodLabel(key)}
function periodKeys(){return[...new Set(allPeriodRecords().map(r=>periodKey(r.statementDate)).filter(Boolean))].sort().reverse()}
function showPage(name){$('homePage').classList.toggle('active',name==='home');$('recordsPage').classList.toggle('active',name==='records');$('limitsPage').classList.toggle('active',name==='limits');$('settingsPage').classList.toggle('active',name==='settings');document.querySelector('.add').style.display=name==='home'?'block':'none';window.scrollTo(0,0)}
function renderRecordsPage(selectedKey=''){
 const keys=periodKeys(),lastKey=latestPeriodBeforeCurrent(),key=selectedKey||lastKey||keys[0]||'';
 $('periodSelect').innerHTML=keys.length?keys.map(k=>`<option value="${k}" ${k===key?'selected':''}>${periodLabel(k)}</option>`).join(''):'<option value="">未有記錄</option>';
 if(!key){$('recordsContent').innerHTML='<div class="recordEmpty">尚未有任何結單記錄</div>';return}
 const x=summarizePeriod(key),all=allPeriodRecords().filter(r=>periodKey(r.statementDate)===key).sort((a,b)=>(a.dueDate||'').localeCompare(b.dueDate||''));
 const row=r=>`<div class="periodRow"><div class="periodRowTop"><span>${esc(r.category)} · ${esc(r.name)} (${esc(r.last4)})</span><span>${money(r.amount,r.currency)}</span></div><div class="periodRowMeta">今期結單：${esc(r.statementDate||'未設定')}　還款到期：${esc(r.dueDate)}<br><span class="${r.recordState==='paid'?'paidMark':'unpaidMark'}">${r.recordState==='paid'?'已還清'+(r.paidDate?' · '+esc(r.paidDate):''):'尚未還款'}</span></div></div>`;
 const groups={};all.forEach(r=>(groups[r.category]??=[]).push(r));
 $('recordsContent').innerHTML=`<section class="recordsSection"><h3>${periodLabel(key)}總覽</h3><div class="periodSummary"><div class="periodBox"><small>尚未還款</small><strong>${x.unpaidText}</strong></div><div class="periodBox"><small>已還清</small><strong>${x.paidText}</strong></div></div></section><section class="recordsSection"><h3>該期全部記錄</h3>${Object.keys(groups).sort().map(g=>`<div class="recordGroup"><div class="recordGroupTitle"><span>${esc(g)}</span><span>${groups[g].length} 張</span></div>${groups[g].map(row).join('')}</div>`).join('')||'<div class="historyEmpty">此期沒有記錄</div>'}</section>`
}
function cardLimitKey(c){return`${c.category.trim().toLowerCase()}|${c.name.trim().toLowerCase()}|${c.last4}`}
function activePreviousUnpaid(c){return c.paid?0:Number(c.amount||0)}
const TU_RANGES=[['A',3526,4000],['B',3417,3525],['C',3240,3416],['D',3214,3239],['E',3143,3213],['F',3088,3142],['G',2990,3087],['H',2868,2989],['I',1820,2867],['J',1000,1819]];
function predictedGrade(score){return(TU_RANGES.find(x=>score>=x[1]&&score<=x[2])||['J',1000,1819])}
function calculatePredictedScore(rows,currencies){
 if(currencies.length!==1)return{available:false,reason:'存在不同幣別，無法直接合併使用率'};
 const ccy=currencies[0],totalLimit=rows.reduce((n,r)=>n+r.limit,0),totalUsed=rows.reduce((n,r)=>n+r.used,0);
 if(totalLimit<=0)return{available:false,reason:'請先設定所有信用卡額度'};
 const rate=totalUsed/totalLimit*100;
 let score=3423+(35.06-rate)*3;
 const overduePaid=history.filter(h=>h.paidDate&&h.dueDate&&h.paidDate>h.dueDate).length;
 const overdueOpen=cards.filter(c=>!c.paid&&c.dueDate&&daysLeft(c.dueDate)<0).length;
 score-=Math.min(240,overduePaid*55+overdueOpen*90);
 score=Math.max(1000,Math.min(4000,Math.round(score)));
 const grade=predictedGrade(score),next=TU_RANGES[TU_RANGES.findIndex(x=>x[0]===grade[0])-1];
 return{available:true,score,grade,rate,overduePaid,overdueOpen,next};
}
function renderScorePrediction(rows,currencies){
 const x=calculatePredictedScore(rows,currencies);
 if(!x.available){$('scorePrediction').innerHTML=`<section class="scorePredict"><div class="scoreHead"><div class="scoreTitle">環聯分數及評級</div><span class="predictTag">預測</span></div><div class="scoreDisclaimer">暫不能預測：${esc(x.reason)}。此功能只提供個人趨勢參考。</div></section>`;return}
 const [grade,min,max]=x.grade,position=(x.score-1000)/3000*100,gap=x.next?Math.max(0,x.next[1]-x.score):0;
 const direction=x.rate<35.06?'使用率較基準低':x.rate>35.06?'使用率較基準高':'使用率與基準相同';
 $('scorePrediction').innerHTML=`<section class="scorePredict"><div class="scoreHead"><div><div class="scoreTitle">環聯分數及評級</div><div class="scoreRange">個人基準：3423分 · B級 · 使用率35.06%</div></div><span class="predictTag">預測</span></div><div class="scoreMain"><div class="scoreGrade">${grade}</div><div><div class="scoreNumber">預測 ${x.score.toLocaleString()} 分</div><div class="scoreRange">${grade}級範圍 ${min.toLocaleString()}–${max.toLocaleString()}${x.next?` · 距${x.next[0]}級約 ${gap} 分`:''}</div></div></div><div class="scoreTrack"><div class="scoreFill" style="width:${Math.max(0,Math.min(100,position))}%"></div></div><div class="scoreFactors"><b>目前整體使用率：</b>${x.rate.toFixed(2)}%，${direction}<br><b>App已記錄：</b>逾期未還 ${x.overdueOpen} 筆，逾期後還清 ${x.overduePaid} 筆</div></section>`
}
function renderLimitsPage(){
 if(!cards.length){$('portfolioSummary').innerHTML='';$('scorePrediction').innerHTML='';$('limitContent').innerHTML='<div class="recordEmpty">尚未建立信用卡資料</div>';return}
 const rows=cards.slice().sort((a,b)=>a.category.localeCompare(b.category)||a.name.localeCompare(b.name)).map(c=>{
  const key=cardLimitKey(c),set=limits[key]||{},limit=Number(set.limit||0),used=Number(set.used||0),previous=activePreviousUnpaid(c),current=Math.max(0,used-previous),rate=limit>0?used/limit*100:0,remaining=Math.max(0,limit-used),cls=rate>=90?'high':rate>=70?'warn':'';
  return{c,key,set,limit,used,previous,current,rate,remaining,cls}
 });
 const currencies=[...new Set(rows.map(r=>r.c.currency))];
 renderScorePrediction(rows,currencies);
 const sumBy=(field,currency)=>rows.filter(r=>r.c.currency===currency).reduce((n,r)=>n+Number(r[field]||0),0);
 const summaryText=field=>currencies.map(ccy=>money(sumBy(field,ccy),ccy)).join(' + ');
 const rateText=currencies.length===1?(()=>{let totalLimit=sumBy('limit',currencies[0]),totalUsed=sumBy('used',currencies[0]);return totalLimit>0?(totalUsed/totalLimit*100).toFixed(1)+'%':'--'})():'按幣別查看';
 $('portfolioSummary').innerHTML=`<section class="portfolioSummary"><div class="portfolioTitle">所有信用卡合計</div><div class="portfolioGrid"><div class="portfolioBox"><small>總額度</small><strong>${summaryText('limit')}</strong></div><div class="portfolioBox"><small>目前已使用</small><strong>${summaryText('used')}</strong></div><div class="portfolioBox"><small>整體使用率</small><strong class="portfolioRate">${rateText}</strong></div><div class="portfolioBox"><small>上期未還</small><strong>${summaryText('previous')}</strong></div><div class="portfolioBox"><small>今期消費</small><strong>${summaryText('current')}</strong></div><div class="portfolioBox"><small>總可用額</small><strong>${summaryText('remaining')}</strong></div></div></section>`;
 $('limitContent').innerHTML=rows.map(r=>{
  const {c,limit,used,previous,current,rate,remaining,cls}=r;
  return`<article class="limitCard"><div class="limitTop"><div><div class="limitName">${esc(c.category)} · ${esc(c.name)} (${esc(c.last4)})</div><div class="limitMeta">${c.currency} · 還款到期 ${esc(c.dueDate)}</div></div><button class="limitEdit" onclick="editLimit('${c.id}')">${limit?'修改':'設定'}</button></div><div class="usageBar"><div class="usageFill ${cls}" style="width:${Math.min(100,rate)}%"></div></div><div class="limitGrid"><div class="limitBox"><small>信用卡總額</small><strong>${limit?money(limit,c.currency):'未設定'}</strong></div><div class="limitBox"><small>使用率</small><strong class="limitRate">${limit?rate.toFixed(1)+'%':'--'}</strong></div><div class="limitBox"><small>上期未還</small><strong>${money(previous,c.currency)}</strong></div><div class="limitBox"><small>今期消費</small><strong>${money(current,c.currency)}</strong></div><div class="limitBox"><small>目前已使用</small><strong>${money(used,c.currency)}</strong></div><div class="limitBox"><small>可用額</small><strong>${limit?money(remaining,c.currency):'--'}</strong></div></div></article>`
 }).join('')
}
function openLimitsPage(){renderLimitsPage();showPage('limits')}
window.editLimit=id=>{let c=cards.find(x=>x.id===id),key=cardLimitKey(c),set=limits[key]||{};$('limitCardId').value=id;$('limitDialogTitle').textContent=`${c.category} ${c.name} (${c.last4})`;$('creditLimit').value=set.limit||'';$('currentUsed').value=set.used||'';$('limitDialog').showModal()}
function openRecordsPage(){renderRecordsPage();showPage('records')}
function showLastPeriod(){
 let key=latestPeriodBeforeCurrent();if(!key){toast('未有上期記錄');return}let x=summarizePeriod(key);$('periodTitle').textContent=periodLabel(key)+'總覽';$('periodUnpaid').textContent=x.unpaidText;$('periodPaid').textContent=x.paidText;
 $('periodList').innerHTML=x.rows.length?x.rows.sort((a,b)=>(a.dueDate||'').localeCompare(b.dueDate||'')).map(r=>`<div class="periodRow"><div class="periodRowTop"><span>${esc(r.category)} · ${esc(r.name)} (${esc(r.last4)})</span><span>${money(r.amount,r.currency)}</span></div><div class="periodRowMeta">還款到期：${esc(r.dueDate)}　<span class="${r.recordState==='paid'?'paidMark':'unpaidMark'}">${r.recordState==='paid'?'已還清':'尚未還款'}</span></div></div>`).join(''):'<div class="historyEmpty">此期沒有記錄</div>';
 $('periodDialog').showModal()
}
function render(){
 cards.sort((a,b)=>Number(a.paid)-Number(b.paid)||a.category.localeCompare(b.category)||a.dueDate.localeCompare(b.dueDate));
 let pending=cards.filter(c=>!c.paid),totals={};pending.forEach(c=>totals[c.currency]=(totals[c.currency]||0)+Number(c.amount));
 $('count').textContent=pending.length+' 筆';let keys=Object.keys(totals);$('total').textContent=keys.length===0?'0.00':keys.length===1?money(totals[keys[0]],keys[0]):keys.length+' 種幣別';
 list.innerHTML='';
 if(!cards.length){list.innerHTML=`<div class="empty"><b>尚未建立還款提醒</b>按下方「新增還款」開始記錄</div>`;updateLastPeriod();localStorage.setItem(KEY,JSON.stringify(cards));return}
 const groups={};cards.forEach(c=>{const key=(c.category||'未分類').trim();(groups[key]??=[]).push(c)});
 Object.keys(groups).sort((a,b)=>a.localeCompare(b)).forEach(category=>{
   const items=groups[category];
   const section=document.createElement('section');section.className='group';
   section.innerHTML=`<div class="groupHead"><div class="groupTitle"><div class="groupBadge">${esc(category).slice(0,1).toUpperCase()}</div><div><span class="groupName">${esc(category).toUpperCase()}</span><span class="groupCount">${items.length} 張</span></div></div><div><button class="historyBtn" type="button">往期記錄</button><button class="groupAdd" type="button">＋ 新增</button></div></div><div class="groupBody"></div><div class="historyPanel"></div>`;
   section.querySelector('.groupAdd').onclick=()=>openEditor(null,category);
   const panel=section.querySelector('.historyPanel'),past=history.filter(h=>h.category.trim().toLowerCase()===category.trim().toLowerCase()).sort((a,b)=>(b.dueDate||'').localeCompare(a.dueDate||''));
   panel.innerHTML=past.length?past.map(h=>`<div class="historyRow"><div class="historyMain"><b>${esc(h.name)} (${esc(h.last4)})</b>今期結單：${esc(h.statementDate||'未設定')}　還款到期：${esc(h.dueDate)}　${h.paidDate?'已還：'+esc(h.paidDate):''}</div><div class="historyAmount">${money(h.amount,h.currency)}</div></div>`).join(''):'<div class="historyEmpty">此分類尚未有往期記錄</div>';
   section.querySelector('.historyBtn').textContent=`往期記錄 ${past.length?`(${past.length})`:''}`;
   section.querySelector('.historyBtn').onclick=()=>panel.classList.toggle('open');
   const body=section.querySelector('.groupBody');
   items.forEach(c=>{let st=status(c);body.insertAdjacentHTML('beforeend',`<article class="card"><div class="top"><div class="logo">${esc(c.category).slice(0,1).toUpperCase()}</div><div class="info"><div class="name">${esc(c.name)} (${esc(c.last4)}) : <span class="amount">${money(c.amount,c.currency)}</span></div><div class="due">今期結單：${esc(c.statementDate||c.nextStatementDate||'未設定')}　還款到期：${esc(c.dueDate)}</div></div><div class="status ${st[1]}">${st[0]}</div></div><div class="actions"><button onclick="togglePaid('${c.id}')">${c.paid?'恢復未還':'✓ 已還款'}</button><button onclick="editCard('${c.id}')">修改</button><button class="danger" onclick="removeCard('${c.id}')">刪除</button></div></article>`)});
   list.appendChild(section)
 });
 updateLastPeriod();localStorage.setItem(KEY,JSON.stringify(cards));localStorage.setItem(HISTORY_KEY,JSON.stringify(history))
}
function openEditor(c,presetCategory=''){let locked=!c&&presetCategory;$('modalTitle').textContent=c?'修改還款':locked?`新增至 ${presetCategory}`:'新增還款';$('id').value=c?.id||'';$('category').value=c?.category||presetCategory||'';$('category').readOnly=!!locked;$('category').style.background=locked?'#edf4f9':'#f8fbfd';$('cardName').value=c?.name||'';$('last4').value=c?.last4||'';$('currency').value=c?.currency||'HKD';$('amount').value=c?.amount||'';$('statementDate').value=c?.statementDate||c?.nextStatementDate||new Date().toISOString().slice(0,10);$('dueDate').value=c?.dueDate||'';$('predictionHint').textContent='';if(!c)predictDueDate();dlg.showModal()}
$('addBtn').onclick=()=>openEditor();$('cancel').onclick=()=>dlg.close();window.editCard=id=>openEditor(cards.find(c=>c.id===id));window.togglePaid=id=>{let c=cards.find(c=>c.id===id);if(!c.paid){c.paid=true;let archiveKey=`${c.id}|${c.statementDate}|${c.dueDate}`;if(!history.some(h=>h.archiveKey===archiveKey))history.push({...c,archiveKey,paidDate:new Date().toISOString().slice(0,10),archivedAt:Date.now()})}else{c.paid=false;let archiveKey=`${c.id}|${c.statementDate}|${c.dueDate}`;history=history.filter(h=>h.archiveKey!==archiveKey)}localStorage.setItem(HISTORY_KEY,JSON.stringify(history));render()};window.removeCard=id=>{let c=cards.find(c=>c.id===id);if(confirm(`確定刪除「${c.category} ${c.name} (${c.last4})」？`)){cards=cards.filter(x=>x.id!==id);render()}};

function parseLocalDate(value){let [y,m,d]=value.split('-').map(Number);return new Date(y,m-1,d)}
function isoLocal(date){let y=date.getFullYear(),m=String(date.getMonth()+1).padStart(2,'0'),d=String(date.getDate()).padStart(2,'0');return `${y}-${m}-${d}`}
function addDays(date,days){let d=new Date(date);d.setDate(d.getDate()+days);return d}
function median(nums){if(!nums.length)return null;let a=[...nums].sort((x,y)=>x-y),m=Math.floor(a.length/2);return a.length%2?a[m]:Math.round((a[m-1]+a[m])/2)}
function adjustWeekend(date){let d=new Date(date),day=d.getDay();if(day===6)d.setDate(d.getDate()+2);if(day===0)d.setDate(d.getDate()+1);return d}
function medianDay(days){return days.length?median(days):null}
function nextMonthDue(statementDate,dayOfMonth){
 let s=parseLocalDate(statementDate),y=s.getFullYear(),m=s.getMonth()+1;if(m>11){m=0;y++}
 let last=new Date(y,m+1,0).getDate();return new Date(y,m,Math.min(dayOfMonth,last))
}
function learnedDueWeekendDirection(source,usualDay){
 let votes=[];source.forEach(c=>{if(!c.dueDate)return;let actual=parseLocalDate(c.dueDate),scheduled=new Date(actual.getFullYear(),actual.getMonth(),Math.min(usualDay,new Date(actual.getFullYear(),actual.getMonth()+1,0).getDate()));if(scheduled.getDay()===6||scheduled.getDay()===0){let diff=Math.round((actual-scheduled)/86400000);if(diff!==0&&Math.abs(diff)<=3)votes.push(Math.sign(diff))}});return votes.length?Math.sign(votes.reduce((a,b)=>a+b,0)):1
}
function adjustDueWeekend(date,direction){let d=new Date(date),day=d.getDay();if(day===6)d.setDate(d.getDate()+(direction<0?-1:2));if(day===0)d.setDate(d.getDate()+(direction<0?-2:1));return d}
function dueBasis(){
 const category=$('category').value.trim().toLowerCase(),name=$('cardName').value.trim().toLowerCase(),last4=$('last4').value.trim();
 const valid=cards.filter(c=>c.dueDate);
 const sameCard=valid.filter(c=>c.category.toLowerCase()===category&&c.name.toLowerCase()===name&&c.last4===last4);
 const sameCategory=valid.filter(c=>c.category.toLowerCase()===category);
 const source=sameCard.length?sameCard:sameCategory;
 const days=source.map(c=>parseLocalDate(c.dueDate).getDate());
 return {usualDay:medianDay(days),source,label:sameCard.length?'按此卡過往到期日':sameCategory.length?'按此分類過往到期日':'尚無過往到期日'}
}
function predictDueDate(){
 const statement=$('statementDate').value;if(!statement)return;
 const basis=dueBasis();
 if(basis.usualDay===null){$('dueDate').value='';$('predictionHint').textContent='首次請輸入實際還款到期日；之後輸入今期結單便會自動預測';return}
 let raw=nextMonthDue(statement,basis.usualDay),weekend=raw.getDay()===0||raw.getDay()===6,direction=learnedDueWeekendDirection(basis.source,basis.usualDay),predicted=adjustDueWeekend(raw,direction);
 $('dueDate').value=isoLocal(predicted);
 $('predictionHint').textContent=`${basis.label}預測下月約 ${basis.usualDay} 日${weekend?`，遇週末${direction<0?'提前至星期五':'順延至星期一'}`:''}；可手動修改`;
}

function applyTheme(t){
 const bg=themeBackground(t);document.body.classList.add('custom-bg');document.body.style.backgroundImage=bg;document.body.style.backgroundPosition=`${t.positionX??50}% ${t.positionY??50}%`;document.body.style.backgroundSize=t.fit||'cover';document.body.style.backgroundRepeat=t.fit==='contain'?'no-repeat':'no-repeat';document.body.style.backgroundAttachment='fixed';document.documentElement.style.backgroundImage=bg;document.documentElement.style.backgroundPosition=`${t.positionX??50}% ${t.positionY??50}%`;document.documentElement.style.backgroundSize=t.fit||'cover';document.documentElement.style.backgroundRepeat='no-repeat';document.documentElement.style.backgroundAttachment='fixed';document.documentElement.style.setProperty('--overlay-opacity',Number(t.opacity)/100);const mc=t.moduleColor||'#edf3f7';document.documentElement.style.setProperty('--group-surface',mc);const rgb=mc.replace('#','');const lum=(parseInt(rgb.slice(0,2),16)*299+parseInt(rgb.slice(2,4),16)*587+parseInt(rgb.slice(4,6),16)*114)/1000;document.documentElement.style.setProperty('--group-text',lum<145?'#ffffff':'#123b5b');document.documentElement.style.setProperty('--group-muted',lum<145?'#e6eef5':'#587084');document.documentElement.style.setProperty('--group-accent',lum<145?'#ffffff':'#0f6cbd');document.documentElement.style.setProperty('--list-grey-opacity',Number(t.listGreyOpacity??72)/100);void document.body.offsetHeight
}

 let t=pendingTheme;$('themePreview').style.backgroundImage=themeBackground(t);$('themePreview').style.backgroundPosition=`${t.positionX??50}% ${t.positionY??50}%`;$('themePreview').style.backgroundSize=t.fit||'cover';$('themePreview').style.backgroundRepeat='no-repeat';$('themePreviewOverlay').style.background=`rgba(245,247,250,${t.opacity/100})`;$('opacityValue').textContent=t.opacity+'%';$('moduleColor').value=t.moduleColor||'#edf3f7';$('listGreyOpacity').value=t.listGreyOpacity??72;$('listGreyValue').textContent=(t.listGreyOpacity??72)+'%';$('positionX').value=t.positionX??50;$('positionY').value=t.positionY??50;$('positionXValue').textContent=(t.positionX??50)+'%';$('positionYValue').textContent=(t.positionY??50)+'%';$('fitCover').classList.toggle('active',(t.fit||'cover')==='cover');$('fitContain').classList.toggle('active',t.fit==='contain');document.querySelectorAll('.themeChoice').forEach(b=>b.classList.toggle('active',b.dataset.theme===t.type))
}
function compressBackground(file){
 return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const max=1280,scale=Math.min(1,max/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale)),canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);resolve(canvas.toDataURL('image/jpeg',0.72))};img.src=reader.result};reader.readAsDataURL(file)})
}
const BACKUP_KEYS=[KEY,HISTORY_KEY,LIMIT_KEY,THEME_KEY,LANG_KEY];
function exportBackup(){
 const payload={app:'CreditCardReminder',version:1,exportedAt:new Date().toISOString(),data:{}};BACKUP_KEYS.forEach(k=>payload.data[k]=localStorage.getItem(k));const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`credit-card-reminder-backup-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);$('dataStatus').textContent=currentLang==='en'?'JSON backup exported':'JSON備份已匯出'
}
async function importBackup(file){
 try{const text=await file.text(),payload=JSON.parse(text);if(!payload||payload.app!=='CreditCardReminder'||!payload.data||typeof payload.data!=='object')throw new Error('Invalid backup');const present=BACKUP_KEYS.filter(k=>Object.prototype.hasOwnProperty.call(payload.data,k));if(!present.length)throw new Error('No supported data');const msg=currentLang==='en'?'Importing will replace the current app data. Continue?':'載入後會覆蓋目前App資料，確定繼續？';if(!confirm(msg)){$('importData').value='';return}present.forEach(k=>{const v=payload.data[k];if(v===null||v===undefined)localStorage.removeItem(k);else localStorage.setItem(k,String(v))});alert(currentLang==='en'?'Import completed. The app will reload.':'載入完成，App將重新整理。');location.reload()}catch(err){alert(currentLang==='en'?'Invalid or damaged JSON backup.':'JSON備份格式不正確或檔案已損壞。');$('importData').value=''}
}
$('exportData').onclick=exportBackup;

// ----- 升級後的通知與權限處理 -----
function updateNotifyBtnState(){
  const btn=$('notifyBtn');
  if(!('Notification' in window)){
    btn.textContent='不支援通知';
    btn.disabled=true;
    return;
  }
  if(Notification.permission==='granted'){
    btn.textContent='通知已開啟';
    btn.style.background='#1d7a4644';
  }else if(Notification.permission==='denied'){
    btn.textContent='通知被封鎖';
    btn.style.background='#b9373244';
  }else{
    btn.textContent='開啟通知';
    btn.style.background='#ffffff18';
  }
}

$('notifyBtn').onclick=async()=>{
  if(!('Notification' in window)){
    alert('此瀏覽器不支援通知功能');
    return;
  }
  const p=await Notification.requestPermission();
  updateNotifyBtnState();
  if(p==='granted'){
    toast('通知已成功開啟！');
    try{
      new Notification('信用卡還款提醒',{body:'通知權限設定成功！系統將在到期日前發送提醒。'});
    }catch(e){}
  }else if(p==='denied'){
    alert('通知權限已被拒絕。如需接收提醒，請至手機瀏覽器或系統設定中解除封鎖（iOS 用戶請確保已將網頁加入主畫面）。');
  }else{
    toast('未取得通知權限');
  }
};

$('testNotifyBtn').onclick=async()=>{
  if(!('Notification' in window)){
    alert('此瀏覽器不支援通知');
    return;
  }
  if(Notification.permission!=='granted'){
    const p=await Notification.requestPermission();
    updateNotifyBtnState();
    if(p!=='granted'){
      alert('請先點擊「開啟通知」並允許權限，才能發送測試通知');
      return;
    }
  }
  try{
    new Notification('測試還款提醒',{
      body: '這是一則測試通知！您的手機推播功能運作完全正常。'
    });
    toast('已發送測試通知，請檢查通知欄');
  }catch(err){
    alert('發送測試通知失敗：'+err.message);
  }
};

function toast(s){let t=$('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
function checkNotifications(){if(!('Notification'in window)||Notification.permission!=='granted')return;let now=new Date();if(now.getHours()!==8||now.getMinutes()<50)return;let today=now.toISOString().slice(0,10);cards.forEach(c=>{if(c.paid)return;let d=daysLeft(c.dueDate),kind=d===1?'before':d===0?'due':null;if(!kind)return;c.notified=c.notified||{};let key=today+kind;if(c.notified[key])return;let title=kind==='before'?`${c.category} ${c.name} (${c.last4}) 請預備還款`:`${c.category} ${c.name} (${c.last4}) 今日到期`;let body=kind==='before'?`${money(c.amount,c.currency)} 明天到期`:`應還金額：${money(c.amount,c.currency)}`;new Notification(title,{body,icon:''});c.notified[key]=true;localStorage.setItem(KEY,JSON.stringify(cards))})}
async function requestAppPermissions(){
 try{
   if('Notification' in window && Notification.permission==='default') await Notification.requestPermission();
   if(navigator.storage && navigator.storage.persist) await navigator.storage.persist();
   if(window.Android && typeof window.Android.requestBackgroundPermissions==='function') window.Android.requestBackgroundPermissions();
   if(window.Android && typeof window.Android.requestExactAlarmPermission==='function') window.Android.requestExactAlarmPermission();
   if(window.Android && typeof window.Android.disableBatteryOptimization==='function') window.Android.disableBatteryOptimization();
 }catch(e){console.log('Permission request skipped:',e)}
}
let wakeLock=null;
async function keepAwake(){try{if('wakeLock' in navigator && document.visibilityState==='visible')wakeLock=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){requestAppPermissions();keepAwake();checkNotifications()}});
window.addEventListener('load',()=>{requestAppPermissions();keepAwake();updateNotifyBtnState()});
render();applyLanguage(document.body);$('languageSelect').value=currentLang;checkNotifications();setInterval(checkNotifications,30000);
