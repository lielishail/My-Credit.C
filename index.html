// 讀取通知設定
function getNotifSettings() {
  const defaultSettings = { enabled: true, hour: 8, minute: 0 };
  try {
    const stored = JSON.parse(localStorage.getItem(NOTIF_SETTINGS_KEY));
    if (stored) return { ...defaultSettings, ...stored };
  } catch(e) {}
  return defaultSettings;
}

// 儲存通知設定
function saveNotifSettings(settings) {
  localStorage.setItem(NOTIF_SETTINGS_KEY, JSON.stringify(settings));
}

// 在設置頁面中填入目前的設定值

  const s = getNotifSettings();
  $('#notifEnabled').checked = s.enabled;
  $('#notifHour').value = s.hour;
  $('#notifMinute').value = s.minute;
}

// 初始化時段下拉選單
function populateTimeSelectors() {
  const hourSel = $('#notifHour');
  hourSel.innerHTML = '';
  for (let i=0; i<24; i++) {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = String(i).padStart(2,'0') + '時';
    hourSel.appendChild(opt);
  }
  const minSel = $('#notifMinute');
  minSel.innerHTML = '';
  for (let i=0; i<60; i+=5) { // 以5分鐘為單位
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = String(i).padStart(2,'0') + '分';
    minSel.appendChild(opt);
  }
}

// 核心排程函數：取消所有現有通知，重新排程所有未還卡片的兩次提醒
async function scheduleAllNotifications() {
  // 檢查是否在 Capacitor 環境且有通知插件
  if (!window.Capacitor || !window.Capacitor.isNativePlatform()) {
    console.log('非原生環境，跳過排程');
    return;
  }
  try {
    const { LocalNotifications } = await import('@capacitor/local-notifications');
    const settings = getNotifSettings();
    if (!settings.enabled) {
      // 如果停用，取消所有已排程通知
      await LocalNotifications.cancelAll();
      console.log('通知已停用，取消所有排程');
      return;
    }

    // 取消所有舊通知
    await LocalNotifications.cancelAll();

    // 取得所有未還且未過期的卡片 (過期的我們不發提醒)
    const now = new Date();
    now.setHours(0,0,0,0);
    const pending = cards.filter(c => !c.paid && c.dueDate);
    if (pending.length === 0) {
      console.log('無需排程的卡片');
      return;
    }

    // 檢查權限
    const perm = await LocalNotifications.requestPermissions();
    if (perm.display !== 'granted') {
      console.log('通知權限未授予');
      toast('請允許通知權限以接收提醒');
      return;
    }

    const notifications = [];
    const baseDate = new Date();
    baseDate.setHours(settings.hour, settings.minute, 0, 0);

    for (const c of pending) {
      const due = new Date(c.dueDate + 'T00:00:00');
      const today = new Date();
      today.setHours(0,0,0,0);
      // 如果到期日小於今天，跳過（已過期）
      if (due < today) continue;

      // 計算到期前一天和當天的日期（設定為指定時間）
      const dayBefore = new Date(due);
      dayBefore.setDate(dayBefore.getDate() - 1);
      dayBefore.setHours(settings.hour, settings.minute, 0, 0);
      
      const dueDay = new Date(due);
      dueDay.setHours(settings.hour, settings.minute, 0, 0);

      // 如果今天已經超過該時間且是當天，我們可能仍要發送（但為了簡化，只排程未來的時間）
      const nowMs = Date.now();

      // 只排程未來的時間，避免立即觸發
      const scheduleIfFuture = (date, type) => {
        if (date.getTime() > nowMs) {
          const id = parseInt(c.id + (type === 'before' ? '1' : '2') + Math.random().toString().slice(2,5));
          const title = type === 'before' ? `${c.category} ${c.name} (${c.last4}) 明天到期` : `${c.category} ${c.name} (${c.last4}) 今天到期`;
          const body = type === 'before' ? `${money(c.amount, c.currency)} 明天到期，請確保餘額足夠` : `${money(c.amount, c.currency)} 今天到期，請盡快還款`;
          notifications.push({
            id: id,
            title: title,
            body: body,
            schedule: { at: date }
          });
        }
      };

      scheduleIfFuture(dayBefore, 'before');
      scheduleIfFuture(dueDay, 'due');
    }

    if (notifications.length > 0) {
      await LocalNotifications.schedule({ notifications });
      console.log(`已排程 ${notifications.length} 則通知`);
    } else {
      console.log('沒有需要排程的未來通知');
    }
  } catch (e) {
    console.error('排程通知失敗:', e);
    toast('通知設定失敗，請重試');
  }
}

// 測試通知（立即發送一個範例通知）
async function testNotification() {
  if (!window.Capacitor || !window.Capacitor.isNativePlatform()) {
    toast('僅在 App 中支援測試');
    return;
  }
  try {
    const { LocalNotifications } = await import('@capacitor/local-notifications');
    const perm = await LocalNotifications.requestPermissions();
    if (perm.display !== 'granted') {
      toast('請先允許通知權限');
      return;
    }
    await LocalNotifications.schedule({
      notifications: [{
        id: Date.now(),
        title: '測試通知',
        body: '這是一則測試訊息，表示通知功能正常',
        schedule: { at: new Date(Date.now() + 1000) } // 1秒後
      }]
    });
    toast('測試通知已發送');
  } catch(e) {
    toast('測試失敗: '+e.message);
  }
}
