name: Build Capacitor APK

on:
  workflow_dispatch:    # 讓你可以在網頁上手動按按鈕觸發

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 下載你的原始碼
        uses: actions/checkout@v4

      - name: 安裝 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 初始化 npm 並安裝 Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/splash-screen

      - name: 產生 Capacitor 設定檔 (關閉啟動畫面)
        run: |
          echo '{
            "appId": "com.lielishail.mycredit",
            "appName": "My Credit.C",
            "webDir": ".",
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 0,
                "launchAutoHide": true,
                "backgroundColor": "#eef4fa"
              }
            }
          }' > capacitor.config.json

      - name: 同步 Capacitor 並加入 Android 平台
        run: npx cap add android && npx cap sync

      - name: 安裝 Java (Android 編譯需要)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 安裝 Android SDK
        uses: android-actions/setup-android@v3

      - name: 開始編譯 APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 上傳編譯好的 APK 檔案
        uses: actions/upload-artifact@v4
        with:
          name: 我的信用卡App
          path: android/app/build/outputs/apk/debug/app-debug.apk
