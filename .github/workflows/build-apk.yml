name: Build Capacitor APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 雙重保險：強制所有 JavaScript Actions 在 Node.js 24 上執行
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 下載你的原始碼
        uses: actions/checkout@v5  # 已升級至 v5

      - name: 安裝 Node.js
        uses: actions/setup-node@v6  # 已升級至 v6
        with:
          node-version: 24          # 🔥 關鍵修正：從 20 改為 24

      - name: 快取 npm 依賴（加速安裝）
        uses: actions/cache@v5      # 已升級至 v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: 初始化 npm 並安裝 Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/splash-screen

      - name: 產生 capacitor.config.json (關閉啟動畫面)
        run: |
          echo '{
            "appId": "com.lielishail.My-Credit.C",
            "appName": "My Credit.C",
            "webDir": ".",
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 0,
                "launchAutoHide": true,
                "backgroundColor": "#eef4fa"
              }
            }
          }' > capacitor.config.json

      - name: 同步 Capacitor 並加入 Android 平台
        run: npx cap add android && npx cap sync

      - name: 快取 Gradle 依賴（加速編譯）
        uses: actions/cache@v5      # 已升級至 v5
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 安裝 Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 安裝 Android SDK
        uses: android-actions/setup-android@v3

      - name: 開始編譯 APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上傳 APK 檔案
        uses: actions/upload-artifact@v5  # 已升級至 v5
        with:
          name: 我的信用卡App
          path: android/app/build/outputs/apk/debug/app-debug.apk
