name: Build Capacitor APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 下載原始碼
        uses: actions/checkout@v5

      - name: 安裝 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: 快取 npm 依賴
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: 初始化 npm 並安裝 Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/splash-screen @capacitor/local-notifications @capacitor/assets

      - name: 準備網頁文件到 www 目錄
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js *.png *.jpg *.ico www/ 2>/dev/null || true
          if [ ! -f www/index.html ]; then echo "錯誤：找不到 index.html"; exit 1; fi

      - name: 初始化 Capacitor
        run: npx cap init "Credit.C" "com.lielishail.creditc" --web-dir=www

      - name: 加入 Android 平台
        run: npx cap add android

      - name: 修改 capacitor.config.json 並同步
        run: |
          echo '{
            "appId": "com.lielishail.creditc",
            "appName": "Credit.C",
            "webDir": "www",
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 0,
                "launchAutoHide": true,
                "backgroundColor": "#eef4fa"
              }
            }
          }' > capacitor.config.json
          npx cap sync

      # ===== 圖示生成（簡化版本，只使用 --icon 參數） =====
      - name: 產生 App 圖示
        run: |
          if [ -f icon512.png ]; then
            echo "✅ 找到 icon-512.png，開始生成..."
            npx capacitor-assets generate --android --icon "icon512.png"
            echo "✅ 圖示生成完成"
          else
            echo "⚠️ 找不到 icon-512.png，將使用 Capacitor 預設圖示"
          fi

      - name: 快取 Gradle 依賴
        uses: actions/cache@v5
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 安裝 Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 安裝 Android SDK
        uses: android-actions/setup-android@v3

      - name: 編譯 APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上傳 APK
        uses: actions/upload-artifact@v5
        with:
          name: Credit.C-信用卡App
          path: android/app/build/outputs/apk/debug/app-debug.apk
